    <style>
    /* Body Styling */
    body {
        font-family: 'Open Sans', sans-serif;
        background-color: #f4f7fb;
        color: #333;
    }

    /* Section Header */
    .section-heading {
        font-family: 'Montserrat', sans-serif;
        font-size: 36px;
        font-weight: 600;
        color: #0d6efd;
        margin-bottom: 40px;
    }

    /* Contact Section Styling */
    .contact-section {
        background-image: url('contact.webp'); /* Add your background image */
        background-size: cover;
        background-position: center;
        padding: 80px 0;
        position: relative;
    }

    .contact-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
    }

    /* Navbar Styling */
    nav {
        padding: 0.5rem 1rem; /* Reduced padding to make navbar compact */
    }

    .navbar-brand img {
        width: 120px; /* Adjust logo size */
    }

    .navbar-toggler {
        border-color: #0d6efd;
    }

    .navbar-toggler-icon {
        background-color: #0d6efd;
    }

    .navbar-nav .nav-item .nav-link {
        font-size: 14px;
        color: #333;
        padding-left: 1rem;
        padding-right: 1rem;
    }

    .navbar-nav .nav-item .nav-link:hover {
        color: #0d6efd;
    }

    /* Card Styling */
    .card {
        border-radius: 10px;
        box-shadow: 0 4px 20px black;
        background: transparent;
        z-index: 1;
    }

    .card-header {
        background-color: #0d6efd;
        color: white;
        border-radius: 10px 10px 0 0;
    }

    .card-body {
        padding: 30px;
    }

    /* Label Styling */
    .form-label {
        color: white; /* Change label text to white */
    }
    .contact-info {
        margin-top: 20px;
        text-align: center;
    }

    .contact-info p {
        font-size: 16px;
        font-weight: 500;
        color: white; /* Change contact info text color to white */
    }

    .contact-info a {
        color: white; /* Make the email link text color white */
    }

    /* Social Icons */
    .social-icons a {
        font-size: 28px;
        color: #0d6efd;
        margin: 0 15px;
        transition: color 0.3s;
    }

    .social-icons a:hover {
        color: #0056b3;
    }

    .map {
        margin-top: 20px;
    }

.map p{
    color: white;
}


    /* Footer */
    .footer {
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px 0;  /* Adds padding to top and bottom */
        position: fixed;
        bottom: 0;  /* Keeps the footer at the bottom of the page */
        left: 0;
        width: 100%;  /* Ensures the footer stretches across the whole screen */
        text-align: center;  /* Centers the content inside the footer */
    }

    .footer p {
        margin: 0; /* Removes default margin from <p> tag */
    }

    /* Fade-in Animation */
    .fade-in {
        animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
        0% {
            opacity: 0;
        }
        100% {
            opacity: 1;
        }
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .row {
            flex-direction: column;
        }

        .card {
            margin-bottom: 20px;
        }
    }
</style>
